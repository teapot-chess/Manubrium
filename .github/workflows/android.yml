# The Android build. Manubrium for Android is not on Google Play: it is the
# signed .apk on this repository's GitHub releases, which the app itself
# checks for once a day (src/update.ts). Run on a version tag - by hand,
# `gh workflow run android.yml --ref vX.Y.Z`, while the tag trigger is off -
# it makes the release vX.Y.Z with manubrium.apk (always that name, so
# releases/latest/download/manubrium.apk is always the newest), the same
# file under its version, and SHA256SUMS. Run on a branch, it is a build
# and an artifact, no release. The .aab is built too, for the day there is
# a Play Console, and stays an artifact.
#
# Signing: android/app/build.gradle reads the keystore from the MANUBRIUM_*
# variables and signs only when they are set; without them the build is
# unsigned, so a fork gets a build, not a red cross. A tag refuses to be
# unsigned, and refuses any key but ours: Android installs an update only
# over an app signed with the same key, so a release signed with another
# one would strand every phone that has the app. The secrets, where the
# keystore lives, and what not to do with it: docs/releasing.md.
name: Android

on:
  workflow_dispatch:

# Off until December 2026 - restore these triggers to re-enable:
# on:
#   workflow_dispatch:
#   push:
#     tags: ["v*"]
#   # A pull request that touches the Android side builds it too, unsigned
#   # (no secrets reach a pull request) and unpublished (the release job is
#   # for tags). v1.0.0 found out about a plug-in's minimum Android only at
#   # the tag, which is the most expensive moment to find out anything.
#   pull_request:
#     paths:
#       - "android/**"
#       - "package.json"
#       - "package-lock.json"
#       - "capacitor.config.*"
#       - ".github/workflows/android.yml"

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    # GitHub-hosted: the Android SDK and licences come with the hosted image.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: |
            android/build.gradle
            android/app/build.gradle
            android/variables.gradle
            android/gradle/wrapper/gradle-wrapper.properties

      - run: npm ci

      # Push needs Firebase, and Firebase needs google-services.json, which is
      # not in git: it comes from the GOOGLE_SERVICES_JSON secret (the file,
      # base64). Without it the build has no push at all and the app says so;
      # with it, VITE_ANDROID_PUSH=1 lets the app register (src/pushNative.ts).
      - name: Firebase config, if there is one
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "${GOOGLE_SERVICES_JSON:-}" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json
            echo "VITE_ANDROID_PUSH=1" >> "$GITHUB_ENV"
            echo "google-services.json in place: push on"
          else
            echo "no GOOGLE_SERVICES_JSON secret: this build has no push"
          fi

      - name: Build the web bundle
        run: npm run build

      - name: Copy it into the Android project
        run: npx cap sync android

      - name: Version and build number
        run: |
          version=$(node -p "require('./package.json').version")
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          echo "APP_BUILD=${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "Manubrium $version ($GITHUB_RUN_NUMBER)"
          case "$GITHUB_REF" in
            refs/tags/v*)
              tag=${GITHUB_REF#refs/tags/v}
              [ "$tag" = "$version" ] || { echo "::error::tag v$tag but package.json says $version"; exit 1; }
              ;;
          esac

      - name: Is the release keystore set up?
        id: keystore
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [ -n "$ANDROID_KEYSTORE" ]; then
            echo "sign=true" >> "$GITHUB_OUTPUT"
          else
            case "$GITHUB_REF" in
              refs/tags/v*) echo "::error::No ANDROID_KEYSTORE secret: a release must be signed (docs/releasing.md)."; exit 1 ;;
            esac
            echo "sign=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No ANDROID_KEYSTORE secret (a fork?) - the apk will be unsigned and will not install (docs/releasing.md)."
          fi

      - name: Write the keystore
        if: steps.keystore.outputs.sign == 'true'
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "MANUBRIUM_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      # The passwords reach Gradle through the environment of this one step.
      - name: Build the signed bundle and apk
        env:
          MANUBRIUM_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MANUBRIUM_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MANUBRIUM_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android
        run: |
          set -eu
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain \
            -PversionCode="$APP_BUILD" -PversionName="$APP_VERSION" \
            bundleRelease assembleRelease
          ls -l app/build/outputs/bundle/release app/build/outputs/apk/release

      # The release key's certificate, SHA-256 (docs/releasing.md has the same
      # line). A tag stops here on any other: shipping it would make every
      # installed copy refuse the update, with nothing to do about it but
      # uninstalling, which takes the outbox along.
      - name: Check the apk's signature
        if: steps.keystore.outputs.sign == 'true'
        env:
          RELEASE_CERT_SHA256: f478156b2c8ca5b8bf2dc59d081b717edfeda9d60264b82700f585949c2e37b4
        run: |
          set -eu
          tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          apk=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          "$tools/apksigner" verify --print-certs "$apk" | tee "$RUNNER_TEMP/certs.txt"
          got=$(sed -n 's/^.*[Ss]igner.*certificate SHA-256 digest: //p' "$RUNNER_TEMP/certs.txt" | head -1 | tr -d ': ' | tr A-F a-f)
          if [ "$got" != "$RELEASE_CERT_SHA256" ]; then
            case "$GITHUB_REF" in
              refs/tags/v*) echo "::error::the apk is signed with $got, not the release key $RELEASE_CERT_SHA256"; exit 1 ;;
              *) echo "::warning::signed with $got, not the release key: this apk will not update an installed Manubrium" ;;
            esac
          fi

      - name: Name the files after the version
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/out"
          cp android/app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/out/Manubrium-$APP_VERSION-$APP_BUILD.aab"
          apk=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          cp "$apk" "$RUNNER_TEMP/out/Manubrium-$APP_VERSION-$APP_BUILD.apk"
          echo "OUT=$RUNNER_TEMP/out" >> "$GITHUB_ENV"

      - name: Delete the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Manubrium-android-${{ env.APP_VERSION }}-${{ env.APP_BUILD }}
          path: ${{ env.OUT }}
          retention-days: 30
          if-no-files-found: error

  # On a version tag the .apk goes on the GitHub release, which is where
  # phones get it: twice, as manubrium.apk (the stable link and the app's
  # update check want that name) and as Manubrium-<version>-<build>.apk
  # (for whoever keeps old ones), with SHA256SUMS for both. The release is
  # marked latest, so /releases/latest/download/manubrium.apk follows it.
  # The TestFlight workflow makes no releases, so every release is this
  # one's and carries the apk. The .aab stays an artifact.
  release:
    needs: android
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      # Keyless attestation: the OIDC token and the right to store the result.
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: Manubrium-android-*
          merge-multiple: true
          path: out

      - name: manubrium.apk and SHA256SUMS
        run: |
          set -eu
          cd out
          rm -f ./*.aab
          versioned=$(ls Manubrium-*.apk)
          [ "$(echo "$versioned" | wc -l)" -eq 1 ] || { echo "::error::expected one apk, got: $versioned"; exit 1; }
          cp "$versioned" manubrium.apk
          sha256sum manubrium.apk "$versioned" > SHA256SUMS
          cat SHA256SUMS
          version=${GITHUB_REF#refs/tags/v}
          {
            echo "Manubrium $version for Android: download **manubrium.apk** below and open it on the phone."
            echo "The first time, Android asks to allow the browser (or file manager) to install apps."
            echo "After that the app offers each new version itself (More, This phone, Check for updates)."
            echo
            echo "What changed: [CHANGELOG.md](https://github.com/$GITHUB_REPOSITORY/blob/v$version/CHANGELOG.md)."
            echo
            echo "Release key, SHA-256 of the signing certificate:"
            echo '`f4:78:15:6b:2c:8c:a5:b8:bf:2d:c5:9d:08:1b:71:7e:df:ed:a9:d6:02:64:b8:27:00:f5:85:94:9c:2e:37:b4`'
          } > ../notes.md

      # Signed build provenance, keyless (GitHub OIDC, Sigstore). Check with:
      #   gh attestation verify manubrium.apk --repo teapot-chess/Manubrium
      - name: Attest the build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            out/manubrium.apk
            out/Manubrium-*.apk
            out/SHA256SUMS

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: Manubrium ${{ github.ref_name }}
          body_path: notes.md
          make_latest: "true"
          files: |
            out/manubrium.apk
            out/Manubrium-*.apk
            out/SHA256SUMS
          fail_on_unmatched_files: true
